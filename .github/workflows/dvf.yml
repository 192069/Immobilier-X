name: Mettre à jour les données DVF

on:
  # Bouton manuel dans l'onglet Actions
  workflow_dispatch:
  # Le 5 de chaque mois — les nouvelles années paraissent en cours d'année
  schedule:
    - cron: '0 4 5 * *'
  # Relance automatique si tu modifies le périmètre
  push:
    paths:
      - 'dvf.config.json'
      - 'scripts/build-dvf.mjs'

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Télécharger et compacter les ventes
        run: node scripts/build-dvf.mjs

      - name: Publier les fichiers dans le dépôt
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Aucun changement"
            exit 0
          fi
          git commit -m "Données DVF mises à jour"
          # Le dépôt a pu bouger pendant la collecte (elle dure plusieurs
          # minutes) : on rejoue notre commit par-dessus, puis on réessaie.
          for essai in 1 2 3; do
            if git push; then
              echo "Publié"
              exit 0
            fi
            echo "Push refusé, synchronisation puis nouvelle tentative ($essai)"
            git pull --rebase origin main || exit 1
          done
          echo "Échec après 3 tentatives"
          exit 1
